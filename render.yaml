services:
  - type: web
    name: english-flow
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build:render
    staticPublishPath: ./dist/client
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate
      - path: /build-info.json
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate
      - path: /huilv/
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate
      - path: /huilv/index.html
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate
      - path: /huilv/manifest-v6.webmanifest
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate
      - path: /huilv/manifest-v6.webmanifest
        name: Content-Type
        value: application/manifest+json; charset=utf-8
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
