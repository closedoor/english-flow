name: Read Render probe inbox

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/create-render-probe-inbox.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Render build callback
        shell: bash
        run: |
          set -uo pipefail
          endpoint='https://webhook.site/token/ba36bb2f-6efd-485a-a9f1-083a7f44ac6e/requests?sorting=newest&per_page=20'

          for attempt in $(seq 1 42); do
            echo "POLL_ATTEMPT=$attempt"
            if curl -fsS --max-time 20 "$endpoint" -o response.json; then
              count="$(python3 -c 'import json; print(len(json.load(open("response.json")).get("data", [])))' 2>/dev/null || echo 0)"
              echo "REQUEST_COUNT=$count"

              if [[ "$count" =~ ^[0-9]+$ ]] && (( count > 0 )); then
                python3 - <<'PY'
          import json
          import urllib.parse

          payload = json.load(open('response.json', encoding='utf-8'))
          for index, request in enumerate(payload.get('data', []), start=1):
              print('============================================================')
              print(f'REQUEST_INDEX={index}')
              print(f'CREATED_AT={request.get("created_at", "")}')
              print(f'METHOD={request.get("method", "")}')
              print(f'SOURCE_IP={request.get("ip", "")}')
              print(f'USER_AGENT={request.get("user_agent", "")}')
              content = request.get('content') or ''
              print(f'RAW_CONTENT={content}')
              parsed = urllib.parse.parse_qs(content, keep_blank_values=True)
              for key in ('url', 'hostname', 'service_name', 'service_id', 'commit'):
                  print(f'{key.upper()}={parsed.get(key, [""])[0]}')
          PY
                exit 0
              fi
            else
              echo 'REQUESTS_API_UNAVAILABLE=true'
            fi
            sleep 10
          done

          echo 'No Render callback was received before the timeout.'
          exit 1
