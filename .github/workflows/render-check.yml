name: Check Render availability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect expected Render URL
        shell: bash
        run: |
          set +e
          curl --show-error --silent --location --max-time 60 \
            --dump-header headers.txt \
            --output page.html \
            --write-out 'HTTP_CODE=%{http_code}\nEFFECTIVE_URL=%{url_effective}\nREMOTE_IP=%{remote_ip}\n' \
            https://english-flow.onrender.com/
          curl_exit=$?
          echo "CURL_EXIT=$curl_exit"
          echo '--- RESPONSE HEADERS ---'
          tail -n 40 headers.txt 2>/dev/null || true
          echo '--- PAGE TITLE ---'
          grep --only-matching --extended-regexp '<title[^>]*>[^<]*</title>' page.html 2>/dev/null | head -n 3 || true
          echo '--- PAGE BODY PREFIX ---'
          head --bytes=2000 page.html 2>/dev/null || true
          echo
          echo '--- APP MARKERS ---'
          grep --fixed-strings --quiet '词流英语' page.html 2>/dev/null
          echo "HAS_APP_NAME=$?"
          grep --fixed-strings --quiet 'manifest.webmanifest' page.html 2>/dev/null
          echo "HAS_MANIFEST=$?"
          exit 0
