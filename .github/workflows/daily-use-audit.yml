name: Daily-use stability audit

on:
  push:
    branches: [maintenance/daily-use-stability-20260913]

permissions:
  contents: write

concurrency:
  group: daily-use-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_MODULE: /tmp/english-flow-daily/node_modules/playwright/index.mjs
      AXE_SOURCE: /tmp/english-flow-daily/node_modules/axe-core/axe.min.js
      RENDER_EXTERNAL_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply scoped rapid-action fixes
        run: python3 .audit/apply-rapid-actions.py
      - name: Install locked dependencies and lint tooling
        run: |
          npm ci --include=dev
          if [ ! -x node_modules/.bin/eslint ]; then
            npm install --no-save --package-lock=false eslint@9.39.4 eslint-config-next@16.3.2
          fi
      - name: Run complete unit and regression suite
        run: npm test
      - name: Run type, lint and explicit Render checks
        run: |
          npm run typecheck
          npm run lint
          npm run build:render
      - name: Install isolated browser tools
        run: |
          npm install --prefix /tmp/english-flow-daily --no-save --package-lock=false playwright@1.56.1 axe-core@4.10.3
          node /tmp/english-flow-daily/node_modules/playwright/cli.js install --with-deps chromium webkit > /tmp/daily-browser-install.log 2>&1 || { tail -100 /tmp/daily-browser-install.log; exit 1; }
      - name: Run all browser, recovery, accessibility and daily-use scenarios
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist/client > /tmp/daily-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          set +e
          npm run test:browser > /tmp/browser-tests.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            grep -n -B 8 -A 28 -E '"status":"FAIL"|ERR_ASSERTION|RAPID_ACTIONS_SUMMARY|DAILY_USE_AUDIT_SUMMARY' /tmp/browser-tests.log | tail -320 || tail -320 /tmp/browser-tests.log
          else
            grep -E 'SUMMARY|AXE_SERIOUS' /tmp/browser-tests.log
          fi
          exit "$STATUS"
      - name: Save verified product changes to the isolated branch
        run: |
          git add app/page.tsx tests/rapid-actions-stability.test.mjs tests/session-selection.test.mjs TESTING.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Stabilize rapid starts, ratings and toggles'
          git push origin HEAD:refs/heads/maintenance/daily-use-stability-20260913
