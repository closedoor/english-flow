name: Verify installed PWA autoplay repair
on:
  push:
    branches: [maintenance/visible-autoplay-20260915]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_EXTERNAL_URL: http://127.0.0.1:4173
      PLAYWRIGHT_MODULE: /tmp/english-flow-browser/node_modules/playwright/index.mjs
      AXE_SOURCE: /tmp/english-flow-browser/node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Capture existing pre-autoplay build for installed-user reproduction
        run: |
          for f in app/page.tsx app/speech-playback.ts app/globals.css; do git show abe9329e717e38562d14b66bd3de72bf04b2c5f9:$f > "$f"; done
          npm run build:render > /tmp/before-build.log 2>&1 || { tail -60 /tmp/before-build.log; exit 1; }
          cp -a dist/client /tmp/english-flow-before
          git restore app/page.tsx app/speech-playback.ts app/globals.css
      - name: Apply repair
        run: |
          python3 .audit/refine-visible-autoplay.py
          python3 .audit/apply-visible-autoplay.py
      - name: Unit tests, types, lint and build
        run: |
          npm test > /tmp/tests.log 2>&1 || { grep -A18 '^not ok' /tmp/tests.log | head -100; tail -12 /tmp/tests.log; exit 1; }
          tail -10 /tmp/tests.log
          npm run typecheck
          npm run lint
          npm run build:render > /tmp/build.log 2>&1 || { tail -60 /tmp/build.log; exit 1; }
          tail -4 /tmp/build.log
      - name: Install browser engines
        run: |
          npm install --prefix /tmp/english-flow-browser --no-save --package-lock=false playwright@1.56.1 axe-core@4.10.3
          node /tmp/english-flow-browser/node_modules/playwright/cli.js install --with-deps chromium webkit > /tmp/browser-install.log 2>&1 || { tail -50 /tmp/browser-install.log; exit 1; }
      - name: Existing regression, installed-upgrade path and live release checks
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist/client > /tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          npm run test:browser
          node .audit/browser-installed-upgrade.mjs
          PRODUCTION_URL=https://english-flow-mwnn.onrender.com/ EXPECTED_COMMIT=d2c8ed654ec465e6b1f15a60caa5edc4f94e17d5 npm run verify:production
      - name: Save tested repair to this isolated branch
        run: |
          git diff --exit-code package-lock.json render.yaml app/backup-data.ts app/session-utils.ts public/data
          git add app public/sw.js scripts/build-render.mjs scripts/browser-autoplay.mjs scripts/browser-version.mjs tests package.json TESTING.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'Test installed-user upgrade and visible NGSL autoplay repair'
          git push origin HEAD:refs/heads/maintenance/visible-autoplay-20260915
          git rev-parse HEAD
