name: Validate English Flow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: english-flow-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Verify Render production deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PRODUCTION_URL: https://english-flow-mwnn.onrender.com/
          EXPECTED_COMMIT: ${{ github.sha }}
          PRODUCTION_VERIFY_ATTEMPTS: 45
          PRODUCTION_VERIFY_DELAY_MS: 10000
        run: npm run verify:production
