name: Verify Render deployment URL

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/read-render-probe.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read Render callback and verify deployed website
        shell: bash
        run: |
          set -euo pipefail
          api='https://webhook.site/token/ba36bb2f-6efd-485a-a9f1-083a7f44ac6e/requests?sorting=newest&per_page=20'

          for callback_attempt in $(seq 1 42); do
            echo "CALLBACK_ATTEMPT=${callback_attempt}"
            if curl -fsS --connect-timeout 10 --max-time 30 "$api" -o requests.json; then
              url="$(python3 - <<'PY'
          import json
          import urllib.parse

          with open('requests.json', encoding='utf-8') as handle:
              payload = json.load(handle)

          for item in payload.get('data', []):
              form = urllib.parse.parse_qs(item.get('content') or '', keep_blank_values=True)
              url = (form.get('url') or [''])[0]
              if url:
                  print(url)
                  break
          PY
              )"

              if [[ -n "$url" ]]; then
                echo "RENDER_PUBLIC_URL=$url"
                for site_attempt in $(seq 1 30); do
                  echo "SITE_ATTEMPT=${site_attempt}"
                  http_code="$(curl -sS -L --connect-timeout 15 --max-time 60 \
                    -D headers.txt -o body.html -w '%{http_code}' "$url" || true)"
                  title="$(python3 - <<'PY'
          import html
          import pathlib
          import re

          text = pathlib.Path('body.html').read_text('utf-8', errors='ignore') if pathlib.Path('body.html').exists() else ''
          match = re.search(r'<title[^>]*>(.*?)</title>', text, re.I | re.S)
          print(html.unescape(re.sub(r'\s+', ' ', match.group(1)).strip()) if match else '(no title)')
          PY
                  )"
                  echo "HTTP_CODE=$http_code"
                  echo "PAGE_TITLE=$title"

                  if [[ "$http_code" == "200" ]] && grep -qi '<title>词流英语</title>' body.html && grep -qi 'manifest.webmanifest' body.html; then
                    echo "VERIFIED_RENDER_URL=$url"
                    echo "VERIFIED_APP=词流英语"
                    exit 0
                  fi
                  sleep 10
                done

                echo "The Render URL was reported, but the expected application did not become live before timeout."
                exit 1
              fi
            fi
            sleep 10
          done

          echo 'No Render callback was received before timeout.'
          exit 1
