name: Verify Render deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover-render-url.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe current Render URL
        shell: bash
        run: |
          set -euo pipefail
          url="https://english-flow-mwnn.onrender.com/"
          echo "PROBING_URL=$url"

          curl --connect-timeout 15 --max-time 90 --retry 3 --retry-delay 5 \
            -sS -L -D headers.txt -o body.html \
            -w 'HTTP_CODE=%{http_code}\nEFFECTIVE_URL=%{url_effective}\nREMOTE_IP=%{remote_ip}\n' \
            "$url" | tee result.txt

          echo "--- final response headers ---"
          tail -n 40 headers.txt || true
          echo "--- page metadata ---"
          python3 - <<'PY'
          import html
          import pathlib
          import re

          text = pathlib.Path("body.html").read_text("utf-8", errors="ignore")
          title = re.search(r"<title[^>]*>(.*?)</title>", text, re.I | re.S)
          title_text = html.unescape(re.sub(r"\s+", " ", title.group(1)).strip()) if title else "(no title)"
          print(f"PAGE_TITLE={title_text}")
          print(f"HAS_APP_MARKER={'词流英语' in text and 'manifest.webmanifest' in text}")
          print(f"BODY_BYTES={len(text.encode('utf-8'))}")
          PY

          grep -q 'HTTP_CODE=200' result.txt
          grep -qi '<title>词流英语</title>' body.html
          grep -qi 'manifest.webmanifest' body.html
          echo "VERIFIED_RENDER_URL=$url"
