name: Verify Render deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover-render-url.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the deployed English Flow site
        shell: bash
        run: |
          set -euo pipefail
          url='https://english-flow-mwnn.onrender.com/'

          for attempt in $(seq 1 48); do
            echo "Probe attempt ${attempt}/48: ${url}"
            rm -f headers.txt body.html manifest.json

            code="$(curl --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 3 \
              -sS -L -D headers.txt -o body.html -w '%{http_code}' "$url" || true)"

            title="$(python3 - <<'PY'
          import html, pathlib, re
          text = pathlib.Path('body.html').read_text('utf-8', errors='ignore') if pathlib.Path('body.html').exists() else ''
          match = re.search(r'<title[^>]*>(.*?)</title>', text, re.I | re.S)
          print(html.unescape(re.sub(r'\s+', ' ', match.group(1)).strip()) if match else '')
          PY
          )"

            echo "HTTP_CODE=${code}"
            echo "PAGE_TITLE=${title}"

            if [[ "$code" == "200" ]] \
              && [[ "$title" == "词流英语" ]] \
              && grep -q 'manifest.webmanifest' body.html \
              && curl --connect-timeout 15 --max-time 60 -fsS "${url}manifest.webmanifest" -o manifest.json \
              && grep -q '词流英语' manifest.json; then
              echo "VERIFIED_RENDER_URL=${url}"
              echo "DEPLOYMENT_STATUS=LIVE"
              echo '--- final response headers ---'
              tail -n 30 headers.txt || true
              echo '--- manifest ---'
              cat manifest.json
              exit 0
            fi

            sleep 10
          done

          echo 'The Render service exists, but the expected English Flow page did not become live in time.'
          exit 1
