name: Verify Render deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover-render-url.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe expected Render URLs
        shell: bash
        run: |
          set -uo pipefail

          candidates=(
            "https://english-flow.onrender.com/"
            "https://english-flow-v3.onrender.com/"
            "https://english-flow-v3-20260906.onrender.com/"
          )

          found=0
          for url in "${candidates[@]}"; do
            echo "============================================================"
            echo "PROBING_URL=$url"
            rm -f headers.txt body.html

            if curl --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 5 \
              -sS -L -D headers.txt -o body.html \
              -w 'HTTP_CODE=%{http_code}\nEFFECTIVE_URL=%{url_effective}\nREMOTE_IP=%{remote_ip}\n' \
              "$url"; then
              echo "--- final response headers ---"
              tail -n 30 headers.txt || true
              echo "--- page metadata ---"
              python3 - <<'PY'
          import html
          import pathlib
          import re

          text = pathlib.Path("body.html").read_text("utf-8", errors="ignore")
          title = re.search(r"<title[^>]*>(.*?)</title>", text, re.I | re.S)
          title_text = html.unescape(re.sub(r"\s+", " ", title.group(1)).strip()) if title else "(no title)"
          print(f"PAGE_TITLE={title_text}")
          print(f"HAS_ENGLISH_FLOW_TITLE={title_text == '词流英语'}")
          print(f"HAS_APP_MARKER={'词流英语' in text and 'manifest.webmanifest' in text}")
          print(f"BODY_BYTES={len(text.encode('utf-8'))}")
          PY

              if grep -qi '<title>词流英语</title>' body.html; then
                echo "VERIFIED_RENDER_URL=$url"
                found=1
                break
              fi
            else
              echo "REQUEST_FAILED=$url"
            fi
          done

          if [[ "$found" -ne 1 ]]; then
            echo "No expected Render URL returned the English Flow application."
            exit 1
          fi
