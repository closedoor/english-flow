name: Check live Render site

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-render-live.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for the live English Flow page
        shell: bash
        run: |
          set -euo pipefail
          url='https://english-flow-mwnn.onrender.com/'

          for attempt in $(seq 1 30); do
            echo "Attempt ${attempt}/30: ${url}"
            rm -f headers.txt body.html

            code="$(curl -L -sS --connect-timeout 15 --max-time 60 \
              -D headers.txt -o body.html -w '%{http_code}' "$url" || true)"
            echo "HTTP_CODE=${code}"

            if [[ "$code" == "200" ]] && grep -qi '<title>词流英语</title>' body.html \
              && grep -qi 'manifest.webmanifest' body.html; then
              echo "VERIFIED_RENDER_URL=${url}"
              echo "PAGE_TITLE=词流英语"
              echo "BODY_BYTES=$(wc -c < body.html)"
              exit 0
            fi

            if [[ -s body.html ]]; then
              python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('body.html').read_text('utf-8', errors='ignore')
          match = re.search(r'<title[^>]*>(.*?)</title>', text, re.I | re.S)
          print('OBSERVED_TITLE=' + (re.sub(r'\s+', ' ', match.group(1)).strip() if match else '(none)'))
          PY
            fi

            sleep 10
          done

          echo 'The Render URL did not return the expected English Flow page.'
          exit 1
